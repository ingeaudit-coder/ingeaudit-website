<svg viewBox="50 0 838 160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff" />
      <stop offset="50%" class="shine-stop" style="stop-color:#ffffff" />
      <stop offset="100%" style="stop-color:#ffffff" />
    </linearGradient>
  </defs>

  <style>
    @keyframes slide-in {
      from { opacity: 0; transform: translateX(20px); }
      to   { opacity: 1; transform: translateX(0); }
    }
    .logo-group { animation: slide-in 1s ease-out forwards; }

    @keyframes shine {
      0%   { stop-color: #ffffff; }
      50%  { stop-color: #cbd5e1; }
      100% { stop-color: #ffffff; }
    }
    .shine-stop { animation: shine 4s infinite; }

    @keyframes wave-flash {
      0%   { stroke-width: 2.5; }
      4%   { stroke-width: 4.5; }
      12%  { stroke-width: 2.5; }
      100% { stroke-width: 2.5; }
    }
    .wave-pulse-1 { animation: wave-flash 5s infinite; animation-delay: 0s; }
    .wave-pulse-2 { animation: wave-flash 5s infinite; animation-delay: 0.15s; }
    .wave-pulse-3 { animation: wave-flash 5s infinite; animation-delay: 0.3s; }
  </style>

  <!-- Antena -->
  <g stroke="white" stroke-width="2" fill="none" transform="translate(16, 23) scale(0.8)">
    <line x1="48" y1="123" x2="112" y2="123" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 56 120 L 80 40 L 104 120" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" />
    <path d="M 64 100 L 87 70" stroke-width="1.5" stroke-linecap="round" />
    <path d="M 96 100 L 73 70" stroke-width="1.5" stroke-linecap="round" />
    <line x1="64" y1="100" x2="96" y2="100" stroke-width="1.5" stroke-linecap="round" />
    <line x1="73" y1="70" x2="87" y2="70" stroke-width="1.5" stroke-linecap="round" />
    <circle cx="80" cy="37" r="4.5" fill="white" stroke="none" />
    <!-- Ondas izquierda -->
    <g stroke-linecap="round" stroke="white">
      <path class="wave-pulse-1" d="M 72 27 A 12 12 0 0 0 72 47" />
      <path class="wave-pulse-2" d="M 67 20 A 20 20 0 0 0 67 54" />
      <path class="wave-pulse-3" d="M 62 13 A 28 28 0 0 0 62 61" />
    </g>
    <!-- Ondas derecha -->
    <g stroke-linecap="round" stroke="white">
      <path class="wave-pulse-1" d="M 88 27 A 12 12 0 0 1 88 47" />
      <path class="wave-pulse-2" d="M 93 20 A 20 20 0 0 1 93 54" />
      <path class="wave-pulse-3" d="M 98 13 A 28 28 0 0 1 98 61" />
    </g>
  </g>

  <!-- Línea separadora -->
  <line x1="130" y1="35" x2="130" y2="120" stroke="white" stroke-opacity="0.3" stroke-width="2" stroke-linecap="round" />

  <!-- Texto -->
  <g class="logo-group">
    <text x="160" y="117" fill="url(#textGrad)" font-family="'Arial Black', system-ui, sans-serif" font-weight="900" font-size="115" letter-spacing="2">INGEAUDIT</text>
  </g>
</svg>
